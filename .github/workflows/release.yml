name: Test and package release

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Superseded PR checks can stop; published release packaging must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Follow the supported stable image instead of retaining a retired macOS pin.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build installation package
        env:
          PACKAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '1.2.3' }}
        run: python3 -B scripts/package_release.py "$PACKAGE_TAG"
      - name: Build matching website
        env:
          PACKAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '1.2.3' }}
        run: python3 -B scripts/build_pages.py --tag "$PACKAGE_TAG" --package dist/code-gossip.zip
      - name: Test Python runtime and installers
        timeout-minutes: 5
        run: |
          python3 -m pip install pytest pytest-subtests PyYAML
          python3 -m pytest -q
      - name: Install browser test dependencies
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
      - name: Test Soundbar UI
        timeout-minutes: 5
        run: node tests/test_soundbar_ui.cjs
      - name: Test Pages demo
        timeout-minutes: 5
        run: node tests/test_pages.cjs
      - name: Test normal and development installations
        timeout-minutes: 5
        run: E2E_RELEASE_PACKAGE="$PWD/dist/code-gossip.zip" node tests/test_soundbar_e2e.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release'
        with:
          name: installation-package
          path: dist/code-gossip.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release'
        with:
          name: tested-website
          path: dist/pages
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: installation-package
          path: dist
      - name: Publish the completed package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          if grep -Fxq 'code-gossip.zip' <<< "$assets"; then
            mkdir -p "$RUNNER_TEMP/published-package"
            gh release download "$RELEASE_TAG" --pattern code-gossip.zip --dir "$RUNNER_TEMP/published-package" --clobber
            cmp dist/code-gossip.zip "$RUNNER_TEMP/published-package/code-gossip.zip"
            echo "The identical tested installation package is already uploaded."
          else
            gh release upload "$RELEASE_TAG" dist/code-gossip.zip
          fi

  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
